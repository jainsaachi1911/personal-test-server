<!DOCTYPE html>
<html>
<head>
  <title>Secure Encrypted File Server</title>
</head>
<body>

<h2>Upload File</h2>
<input type="file" id="fileInput" />
<button onclick="uploadFile()">Upload</button>

<h2>Files</h2>
<button onclick="loadFiles()">Refresh</button>
<ul id="fileList"></ul>

<script>
const params = new URLSearchParams(window.location.search);
const token = params.get("token");

// Upload file
async function uploadFile() {
  const file = document.getElementById("fileInput").files[0];
  if (!file) return;

  const formData = new FormData();
  formData.append("file", file);

  await fetch("/upload?token=" + token, {
    method: "POST",
    body: formData
  });

  alert("File uploaded successfully!");
  loadFiles();
}

// Download file
async function downloadFile(filename) {
  const res = await fetch("/download/" + filename + "?token=" + token);
  const blob = await res.blob();

  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

// 🔄 Load files
async function loadFiles() {
  const res = await fetch("/files?token=" + token);
  const files = await res.json();

  const list = document.getElementById("fileList");
  list.innerHTML = "";

  files.forEach(file => {
    const li = document.createElement("li");
    li.innerHTML =
      `<button onclick="downloadFile('${file}')">${file}</button>`;
    list.appendChild(li);
  });
}

loadFiles();
</script>

</body>
</html>
